<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fechar Caixa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/fechar-caixa.css">
</head>
<body>

  <header>
    <a href="#" class="logo">
      <img src="../img/logo.png" alt="Logo EstoquePro">
      <h1>EstoquePro</h1>
    </a>

    <ul class="navmenu">
      <li><a href="../html/pagina-inicial.html">Início</a></li>
      <li><a href="#">Vendas do dia</a></li>
    </ul>

    <div class="user-icon">
      <a href="#">
        <div class="avatar">W</div>
        <span>Walber</span>
      </a>
    </div>
  </header>

  <main class="container-caixa">
    <div class="card-caixa">
      
      <div class="header-caixa">
        <h1>Fechar Caixa</h1>
        <span class="linha-decorativa"></span>
      </div>

      <div class="vendas-section">
        <h2>Vendas do Dia</h2>
        <div id="lista-vendas-caixa" class="vendas-list">
        </div>
      </div>

        <div class="total-card">
            <div class="total-card-label">Total</div>
            <div class="total-card-value"><span id="total-caixa">0,00</span></div>
        </div>

      <div class="buttons-section">
        <a href="../html/pagina-inicial.html"><button class="btn-voltar">Voltar</button></a>
        <button class="btn-confirmar" onclick="confirmarFechamento()">Fechar Caixa</button>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/fechar-caixa.js"></script>
</body>
</html>
