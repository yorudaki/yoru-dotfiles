<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Estoque - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/src/css/index.css">
</head>

<body>

    <div class="login-page">

        <header class="logo">
            <h1>Gestão de Estoque</h1>
        </header>

        <main class="login-card">
            <form>
                <label for="usuario">USUÁRIO</label>
                <input type="text" id="usuario" placeholder="Digite seu usuário">

                <label for="senha">SENHA</label>
                <input type="password" id="senha" placeholder="Digite sua senha">

                <button type="submit">
                    ACESSAR SISTEMA
                </button>

                <hr>

                <p>ACESSO AUTORIZADO APENAS PARA FUNCIONÁRIOS</p>
            </form>
        </main>

    </div>
<script src="../js/index.js"></script>
</body>

</html>
