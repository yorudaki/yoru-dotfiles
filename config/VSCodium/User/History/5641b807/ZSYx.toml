"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#e0e0e0)\
$os\
[](bg:#b0b0b0 fg:#e0e0e0)\
$directory\
[](fg:#b0b0b0 bg:#606060)\
$git_branch\
$git_status\
[](#606060)\
$fill\
[](fg:#494949)\
$character\
[](fg:#494949 bg:#ababab)\
$time\
[▓▒░](#ababab)
\n󰁕 """

[character]
# Removemos o bg daqui de dentro do símbolo para não quebrar as bordas
success_symbol = '[](fg:#51c14d bg:#494949)'
error_symbol = '[󱎘](fg:#ff4d4d bg:#404040)'
# O formato força o preenchimento do bloco com o fundo correto
format = " $symbol "

[fill]
symbol = '   '
style = "fg:#555555"

[directory]
style = "fg:#101010 bg:#b0b0b0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"~" = ""

[git_branch]
symbol = ""
style = "bg:#606060"
format = '[[ $symbol $branch ](fg:#e0e0e0 bg:#606060)]($style)'

[git_status]
style = "bg:#606060"
format = '[[($all_status$ahead_behind )](fg:#e0e0e0 bg:#606060)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#ababab"
format = '[[  $time ](fg:#000000 bg:#ababab)]($style)'

[os]
style = "bg:#e0e0e0 fg:#101010"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
CachyOS = ""
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""