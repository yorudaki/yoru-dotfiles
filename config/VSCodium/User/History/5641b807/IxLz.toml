"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#e0e0e0)\
$os\
[](bg:#b0b0b0 fg:#a1a1a1)\
$directory\
[](fg:#b0b0b0 bg:#606060)\
$git_branch\
$git_status\
[](#606060)\
$fill\
[](fg:#e0e0e0)\
$time\
[▓▒░](#e0e0e0)
\n󰁕 
"""

[character]
success_symbol = '[](fg:#51c14d)'
error_symbol = '[󱎘](fg:#ff4d4d)'

[fill]
symbol = '   '
style = "fg:#555555"

[directory]
style = "fg:#101010 bg:#b0b0b0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"~" = ""

[git_branch]
symbol = ""
style = "bg:#606060"
format = '[[ $symbol $branch ](fg:#e0e0e0 bg:#606060)]($style)'

[git_status]
style = "bg:#606060"
format = '[[($all_status$ahead_behind )](fg:#e0e0e0 bg:#606060)]($style)'

[nodejs]
symbol = ""
style = "bg:#303030"
format = '[[ $symbol ($version) ](fg:#e0e0e0 bg:#303030)]($style)'

[bun]
symbol = ""
style = "bg:#303030"
format = '[[ $symbol ($version) ](fg:#e0e0e0 bg:#303030)]($style)'

[rust]
symbol = ""
style = "bg:#303030"
format = '[[ $symbol ($version) ](fg:#e0e0e0 bg:#303030)]($style)'

[golang]
symbol = ""
style = "bg:#303030"
format = '[[ $symbol ($version) ](fg:#e0e0e0 bg:#303030)]($style)'

[php]
symbol = ""
style = "bg:#303030"
format = '[[ $symbol ($version) ](fg:#e0e0e0 bg:#303030)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#1a1a1a"
format = '[[  $time ](fg:#000000 bg:#e0e0e0)]($style)'

[os]
style = "bg:#e0e0e0 fg:#101010"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
CachyOS = " CachyOS"
Windows = "󰍲 Windows"
Ubuntu = "󰕈 Ubuntu"
SUSE = " SUSE"
Raspbian = "󰐿 Raspbian"
Mint = "󰣭 Mint"
Macos = "󰀵 MacOS"
Manjaro = " Manjaro"
Linux = "󰌽 Linux"
Gentoo = "󰣨 Gentoo"
Fedora = "󰣛 Fedora"
Alpine = " Alpine"
Amazon = " Amazon"
Android = " Android"
AOSC = " AOSC"
Arch = "󰣇 Arch"
Artix = "󰣇 Artix"
EndeavourOS = " EndeavourOS"
CentOS = " CentOS"
Debian = "󰣚 Debian"
Redhat = "󱄛 RedHat"
RedHatEnterprise = "󱄛 RHEnterprise"
Pop = " Pop!_OS"