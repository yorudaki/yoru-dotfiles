"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#e0e0e0)\
$os\
[](bg:#b0b0b0 fg:#e0e0e0)\
$directory\
[](fg:#b0b0b0 bg:#606060)\
$git_branch\
$git_status\
[](#606060)\
$fill\
[](fg:#494949)\
$character\
[](fg:#e0e0e0)\
$time\
[▓▒░](#bbbbbb)
\n󰁕 
"""

[character]
success_symbol = '[](bg:#494949 fg:#51c14d)'
error_symbol = '[󱎘](bg:#404040 fg:#ff4d4d)'

[fill]
symbol = '   '
style = "fg:#555555"

[directory]
style = "fg:#101010 bg:#b0b0b0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"~" = ""

[git_branch]
symbol = ""
style = "bg:#606060"
format = '[[ $symbol $branch ](fg:#e0e0e0 bg:#606060)]($style)'

[git_status]
style = "bg:#606060"
format = '[[($all_status$ahead_behind )](fg:#e0e0e0 bg:#606060)]($style)'

[nodejs]
symbol = ""
style = "bg:#303030"
format = '[[ $symbol ($version) ](fg:#e0e0e0 bg:#303030)]($style)'

[bun]
symbol = ""
style = "bg:#303030"
format = '[[ $symbol ($version) ](fg:#e0e0e0 bg:#303030)]($style)'

[rust]
symbol = ""
style = "bg:#303030"
format = '[[ $symbol ($version) ](fg:#e0e0e0 bg:#303030)]($style)'

[golang]
symbol = ""
style = "bg:#303030"
format = '[[ $symbol ($version) ](fg:#e0e0e0 bg:#303030)]($style)'

[php]
symbol = ""
style = "bg:#303030"
format = '[[ $symbol ($version) ](fg:#e0e0e0 bg:#303030)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#1a1a1a"
format = '[[  $time ](fg:#000000 bg:#e0e0e0)]($style)'

[os]
style = "bg:#e0e0e0 fg:#101010"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
CachyOS = ""
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""