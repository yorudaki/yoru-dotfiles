<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstoquePro - Página Inicial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/pagina-inicial.css">
</head>

<body>

  <header>
    <a href="#" class="logo">
      <img src="../img/logo.png" alt="Logo EstoquePro">
      <h1>EstoquePro</h1>
    </a>

    <ul class="navmenu">
      <li><a href="#">Início</a></li>
      <li><a href="#">Vendas do dia</a></li>      
    </ul>

    <div class="user-icon">
      <a href="#">
        <div class="avatar">W</div>
        <span>Walber</span>
      </a>
    </div>
  </header>


  <div class="busca">
    <div class="busca-wrapper">
      <span class="busca-icone"></span>
      <input type="search" id="input-busca" placeholder="Buscar produto pelo nome...">
    </div>
    <button id="btn_produtos">
      <a href="cadastrar-produtos.html">+ Novo Produto</a>
    </button>
  </div>


  <div class="conteudo">

    <div class="produtos">
      <div class="section-title">
        <h2>Produtos Disponíveis no Estoque</h2>
        <span class="linha-decorativa"></span>
      </div>
      <div class="grid-produtos" id="lista-produtos"></div>
    </div>

    <div class="carrinho">
      <div class="section-title">
        <h2>Carrinho</h2>
        <span class="linha-decorativa"></span>
      </div>

      <div class="acoes">
        <button id="btn_vendas" class="btn btn-outline-primary w-100">Vendas</button>
        <a href="fechar-caixa.html">
          <button id="btn_caixa" class="btn btn-outline-primary w-100">Fechar Caixa</button>
        </a>
      </div>

      <div id="lista-carrinho"></div>

      <div class="total">
        <p>Total</p>
        <span id="total">R$ 0,00</span>
      </div>

      <button onclick="fecharVenda()" class="finalizar w-100">Finalizar Venda</button>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/pagina-inicial.js"></script>
</body>

</html>
