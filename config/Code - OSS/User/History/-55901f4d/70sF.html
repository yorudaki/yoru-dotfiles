<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Produto</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/cadastrar-produtos.css">
</head>
<body>

    <header>
    <a href="#" class="logo">
      <img src="../img/logo.png" alt="Logo EstoquePro">
      <h1>EstoquePro</h1>
    </a>

    <ul class="navmenu">
      <li><a href="../html/pagina-inicial.html">Início</a></li>
      <li><a href="#">Vendas do dia</a></li>
    </ul>

    <div class="user-icon">
      <a href="#">
        <div class="avatar">W</div>
        <span>Walber</span>
      </a>
    </div>
  </header>


    <main class="container">

        <section class="card">

            <h1>EDITAR PRODUTO</h1>

            <div class="linha"></div>

            <form class="formulario">

                <div class="campo">
                    <label>INFORME O NOME DO PRODUTO</label>
                    <input type="text" id="nome" placeholder="Ex.: Caneta Azul (BIC)">
                </div>

                <div class="campo">
                    <label>INFORME O VALOR DO PRODUTO</label>
                    <input type="number" id="valor" placeholder="Ex.: 25,90">

                </div>

                <div class="campo">
                    <label>INFORME A QUANTIDADE INICIAL DE ESTOQUE</label>
                    <input type="number" id="quantidade" placeholder="Ex.: 100">
                </div>

                <div class="campo">
           
        
                <label>INFORME A CATEGORIA DO PRODUTO</label>


                <select id="categoria">

                   <option value="">Selecione a categoria</option>

                   <option value="Papelaria">Produtos de Papelaria</option>

                   <option value="Brinquedos">Produtos de Brinquedos</option>

                   <option value="Artigo de decoração">Artigos de decoração</option>

                   <option value="S/Categoria">Sem categoria</option>

                </select>
                </div>

            </form>
            <button id="btnEditar">
                    <i class="fa-regular fa-floppy-disk"></i>
                SALVAR ALTERAÇÕES
            </button>

        </section>

    </main>

<script src="../js/editar_produto.js"></script>
</body>
</html>
